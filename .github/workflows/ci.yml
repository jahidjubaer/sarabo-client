name: CI

# Checks only - this workflow never deploys. Firebase deploys stay manual.
on:
  push:
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as the server CI and Vercel
          cache: npm

      - run: npm ci
      - run: npm run lint
      # This only proves the app compiles; the build is discarded. vite.config.js
      # refuses a production build without an https API URL, so CI passes a
      # reserved .invalid address that can never reach a real server.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.invalid
